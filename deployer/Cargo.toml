[package]
name = "fleab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable desktop app for deploying and launching Unity builds."

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tar = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zstd = "0.13"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
plist = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
futures-util = "0.3"
pollster = "0.4"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]

